<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="sky" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#2A2470"/>
      <stop offset="1" stop-color="#0E0C2A"/>
    </radialGradient>
    <clipPath id="back"><rect x="0" y="0" width="64" height="42"/></clipPath>
    <clipPath id="front"><rect x="0" y="42" width="64" height="22"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- stars -->
  <circle cx="52" cy="10" r="1.3" fill="#FFFFFF"/>
  <circle cx="44" cy="5.5" r="0.8" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="58" cy="22" r="0.8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="6" cy="52" r="0.9" fill="#FFFFFF" opacity="0.7"/>
  <!-- candlesticks -->
  <g stroke-linecap="round">
    <line x1="9" y1="7" x2="9" y2="21" stroke="#FF6B8A" stroke-width="1.4"/>
    <rect x="6.6" y="10" width="4.8" height="7" rx="1" fill="#FF6B8A"/>
    <line x1="16" y1="4" x2="16" y2="17" stroke="#3DDC97" stroke-width="1.4"/>
    <rect x="13.6" y="6" width="4.8" height="8" rx="1" fill="#3DDC97"/>
  </g>
  <!-- orbit ring (back half) -->
  <ellipse cx="32" cy="44" rx="27" ry="8" transform="rotate(-16 32 44)" fill="none" stroke="#3DDC97" stroke-width="2.6" opacity="0.55" clip-path="url(#back)"/>
  <!-- shiba: ears -->
  <path d="M17 30 L19 12 L29 22 Z" fill="#E8873A"/>
  <path d="M47 30 L45 12 L35 22 Z" fill="#E8873A"/>
  <path d="M19.5 26 L20.5 16.5 L26 22 Z" fill="#FFE3C4"/>
  <path d="M44.5 26 L43.5 16.5 L38 22 Z" fill="#FFE3C4"/>
  <!-- head -->
  <path d="M32 19 C44 19 50 27 50 36 C50 46 42 53 32 53 C22 53 14 46 14 36 C14 27 20 19 32 19 Z" fill="#E8873A"/>
  <!-- white muzzle / cheeks -->
  <path d="M15.5 40 C19 37 25 37 28 40 C29.5 38.6 34.5 38.6 36 40 C39 37 45 37 48.5 40 C47 48 40 53 32 53 C24 53 17 48 15.5 40 Z" fill="#FFF4E6"/>
  <!-- eyebrows (麿眉) -->
  <ellipse cx="25" cy="29" rx="2.4" ry="1.5" fill="#FFF4E6"/>
  <ellipse cx="39" cy="29" rx="2.4" ry="1.5" fill="#FFF4E6"/>
  <!-- eyes -->
  <circle cx="25" cy="34" r="2.3" fill="#1A1530"/>
  <circle cx="39" cy="34" r="2.3" fill="#1A1530"/>
  <circle cx="25.8" cy="33.2" r="0.7" fill="#FFFFFF"/>
  <circle cx="39.8" cy="33.2" r="0.7" fill="#FFFFFF"/>
  <!-- nose & mouth -->
  <path d="M29 40.5 C29 39 35 39 35 40.5 C35 42.3 33 43.3 32 43.3 C31 43.3 29 42.3 29 40.5 Z" fill="#1A1530"/>
  <path d="M32 43.3 L32 45.2 M32 45.2 C30.8 46.6 29 46.6 28 45.6 M32 45.2 C33.2 46.6 35 46.6 36 45.6" stroke="#1A1530" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- orbit ring (front half) turning into an up-trend arrow -->
  <ellipse cx="32" cy="44" rx="27" ry="8" transform="rotate(-16 32 44)" fill="none" stroke="#3DDC97" stroke-width="2.6" clip-path="url(#front)"/>
  <path d="M52 43 L60 35" stroke="#3DDC97" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M54.5 33.5 L61.5 33.5 L61.5 40.5 Z" fill="#3DDC97"/>
</svg>
